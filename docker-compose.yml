version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fluently_postgres
    restart: always
    environment:
      POSTGRES_USER: fluently_admin
      POSTGRES_PASSWORD: fluently_password_secret
      POSTGRES_DB: fluently_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluently_admin -d fluently_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fluently_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-backend:
    build:
      context: ./services/core-backend
      dockerfile: Dockerfile
    container_name: fluently_core_backend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://fluently_admin:fluently_password_secret@postgres:5432/fluently_db?schema=public
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: fluently_ai_engine
    restart: always
    environment:
      PORT: 8000
      ENV: development
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
