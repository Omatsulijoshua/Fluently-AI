apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluently-core-backend
  namespace: fluently-prod
  labels:
    app: fluently-core-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluently-core-backend
  template:
    metadata:
      labels:
        app: fluently-core-backend
    spec:
      containers:
        - name: core-backend
          image: fluentlyai/core-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: fluently-config
            - secretRef:
                name: fluently-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluently-core-hpa
  namespace: fluently-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fluently-core-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
