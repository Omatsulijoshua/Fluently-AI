[project]
name = "fluently-ai-engine"
version = "1.0.0"
description = "Fluently AI - Python AI Engine Microservice for Speech, NLP, and Model Routing"
authors = [
    { name = "Fluently AI Team", email = "ai@fluently.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "torch>=2.2.0; platform_system != 'Windows' or python_version < '3.12'",
    "numpy>=1.26.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
