services:
  - type: web
    name: fluently-core-backend
    env: docker
    plan: free
    dockerContext: ./services/core-backend
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fluently-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fluently-redis
          property: connectionString

  - type: web
    name: fluently-ai-engine
    env: docker
    plan: free
    dockerContext: ./services/ai-engine
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: ENV
        value: production

  - type: redis
    name: fluently-redis
    plan: free
    ipAllowList: []

databases:
  - name: fluently-postgres
    databaseName: fluently_db
    user: fluently_admin
    plan: free
